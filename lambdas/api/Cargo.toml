[package]
name = "lambda-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
lambda_http = "0.14"
aws-config = "1"
aws-sdk-sesv2 = "1"
aws-sdk-ssm = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = { version = "0.22", features = ["std"] }
mail-builder = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
fourward-core = { path = "../../crates/4ward-core" }

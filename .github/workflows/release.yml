name: release

on:
  push:
    tags: ["v*"]

jobs:
  build-cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: 4ward-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: 4ward-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: 4ward-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: 4ward-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: 4ward-win32-x64.exe
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p fourward-cli
      - name: Rename
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && '4ward.exe' || '4ward' }}"
          mkdir -p dist && cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  create-release:
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "4ward ${GITHUB_REF_NAME}" \
            --generate-notes \
            $(find binaries -type f)

  build-lambdas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@v1.23.0
      - name: Install cargo-lambda
        run: cargo binstall -y cargo-lambda
      - name: Build forwarder (arm64)
        run: cargo lambda build --arm64 --release --package lambda-forwarder
      - name: Build api (arm64)
        run: cargo lambda build --arm64 --release --package lambda-api

  publish-npm:
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check whether version is already on npm
        id: npmcheck
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "4ward@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "4ward@${VERSION} already on npm - skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npmcheck.outputs.published != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
